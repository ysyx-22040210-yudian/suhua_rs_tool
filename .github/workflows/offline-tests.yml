name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    # Keep a runner with a published setup-python CPython 3.8 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run CLI and real Tk tests on the selected Python
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        # Without a display the Tk tests skip, masking version-specific GUI failures.
        run: |
          xvfb-run -a bash -e <<'BASH'
          python -c 'import sys, tkinter as tk; from rscheck.gui import RsCheckApp; root = tk.Tk(); app = RsCheckApp(root); root.update(); print(sys.version, "Tk", root.tk.call("info", "patchlevel")); assert root.winfo_ismapped(); root.destroy()'
          python -m unittest discover -v
          BASH
