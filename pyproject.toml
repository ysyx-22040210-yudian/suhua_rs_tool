[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rtl-rs-check"
version = "0.1.0"
description = "Check RTL register-slice instances against Excel specifications"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
rtl-rs-check = "rscheck.cli:main"

[tool.setuptools.packages.find]
include = ["rscheck*"]
