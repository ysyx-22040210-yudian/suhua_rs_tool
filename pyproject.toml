[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rtl-rs-check"
version = "0.11.0"
description = "Check RTL register-slice instances against Excel specifications"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
rtl-rs-check = "rscheck.cli:main"
rtl-rs-check-gui = "rscheck.gui:main"
rs-kdebug-collector = "rscheck.kdebug_collector:main"

[tool.setuptools.packages.find]
include = ["rscheck*"]
